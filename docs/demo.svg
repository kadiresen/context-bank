<text class="t" x="380" y="22" text-anchor="middle">~/app (a real v1 bank)</text>
<text id="l0" class="c" x="20" y="52" style="animation-name:k0"><tspan class="p">$ </tspan>npx context-bank doctor</text>
<text id="l1" class="err" x="20" y="72" style="animation-name:k1">error  legacy-contract  AGENTS.md still uses the v1 every-task update contract</text>
