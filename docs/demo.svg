<rect width="820" height="592" rx="10" fill="#0d1117"/>
<rect x="0.5" y="0.5" width="819" height="591" rx="10" fill="none" stroke="#30363d"/>
<circle cx="20" cy="18" r="6" fill="#ff5f57"/><circle cx="40" cy="18" r="6" fill="#febc2e"/><circle cx="60" cy="18" r="6" fill="#28c840"/>
<text class="t" x="410" y="22" text-anchor="middle">~/app (a real v1 bank, context-bank 3.0.0)</text>
<text class="c" x="20" y="52" style="animation-name:k0"><tspan class="p">$ </tspan>npx context-bank doctor</text>
<text class="err" x="20" y="72" style="animation-name:k1">error  legacy-contract  AGENTS.md still uses the v1 every-task update contract</text>
<text class="warn" x="20" y="92" style="animation-name:k2">warn   legacy-contract  rules.md still contains the v1 mandatory-update banner</text>
<text class="warn" x="20" y="112" style="animation-name:k3">warn   legacy-contract  active-context.md still contains the v1 mandatory-update banner</text>
<text class="warn" x="20" y="132" style="animation-name:k4">warn   over-cap         active-context.md is 96677 chars (cap 8000)</text>
<text class="warn" x="20" y="152" style="animation-name:k5">warn   legacy-contract  architecture.md still contains the v1 mandatory-update banner</text>
<text class="warn" x="20" y="172" style="animation-name:k6">warn   legacy-contract  roadmap.md still contains the v1 mandatory-update banner</text>
<text class="warn" x="20" y="192" style="animation-name:k7">warn   over-cap         roadmap.md is 38827 chars (cap 20000)</text>
<text class="warn" x="20" y="212" style="animation-name:k8">warn   legacy-story     .ai/story.md is the v2 single-file story; run `context-bank migrate`</text>
<text class="c" x="20" y="252" style="animation-name:k10"><tspan class="p">$ </tspan>npx context-bank migrate --compact --yes</text>
<text class="ok" x="20" y="272" style="animation-name:k11">updated  AGENTS.md</text>
<text class="ok" x="20" y="292" style="animation-name:k12">updated  CLAUDE.md</text>
<text class="ok" x="20" y="312" style="animation-name:k13">updated  .ai/rules.md</text>
<text class="ok" x="20" y="332" style="animation-name:k14">updated  .ai/active-context.md</text>
<text class="ok" x="20" y="352" style="animation-name:k15">updated  .ai/architecture.md</text>
<text class="ok" x="20" y="372" style="animation-name:k16">updated  .ai/roadmap.md</text>
<text class="ok" x="20" y="392" style="animation-name:k17">updated  .ai/story/2026-06-08-no-i18n-turkish-ui-english-code.md</text>
<text class="ok" x="20" y="412" style="animation-name:k18">updated  .ai/story/2026-06-10-deployed-live-on-caprover-peykflow-com.md</text>
<text class="dim" x="20" y="432" style="animation-name:k19">...      (128 more files, shortened for this demo)</text>
<text class="warn" x="20" y="452" style="animation-name:k20">note     Created 130 decisions in .ai/story/ from story.md and archived story files.</text>
<text class="c" x="20" y="492" style="animation-name:k22"><tspan class="p">$ </tspan>npx context-bank doctor</text>
<text class="good" x="20" y="512" style="animation-name:k23">Bank is healthy.</text>
<text class="note" x="20" y="552" style="animation-name:k25"># session-start reads: ~36k tokens -&gt; ~5k tokens; 130 decisions, each searched on demand</text>
</svg>
