<svg xmlns="http://www.w3.org/2000/svg" width="820" height="592" viewBox="0 0 820 592" role="img" aria-label="context-bank doctor finds a bloated v1 bank, migrate --compact splits it into small files and one file per decision, doctor reports healthy">
