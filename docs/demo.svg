<text id="l9" class="c" x="20" y="232" style="animation-name:k9"><tspan class="p">$ </tspan>npx context-bank migrate --compact --yes</text>
<text id="l10" class="ok" x="20" y="252" style="animation-name:k10">updated  AGENTS.md</text>
<text id="l11" class="ok" x="20" y="272" style="animation-name:k11">updated  CLAUDE.md</text>
<text id="l12" class="ok" x="20" y="292" style="animation-name:k12">updated  .ai/rules.md</text>
<text id="l13" class="ok" x="20" y="312" style="animation-name:k13">updated  .ai/active-context.md</text>
<text id="l14" class="ok" x="20" y="332" style="animation-name:k14">updated  .ai/architecture.md</text>
<text id="l15" class="ok" x="20" y="352" style="animation-name:k15">updated  .ai/roadmap.md</text>
<text id="l16" class="ok" x="20" y="372" style="animation-name:k16">updated  .ai/story.md</text>
<text id="l18" class="c" x="20" y="412" style="animation-name:k18"><tspan class="p">$ </tspan>npx context-bank doctor</text>
<text id="l19" class="good" x="20" y="432" style="animation-name:k19">Bank is healthy.</text>
<text id="l21" class="note" x="20" y="472" style="animation-name:k21"># always-read context: ~81k tokens -&gt; ~3k tokens (overflow copied to .ai/archive/)</text>
