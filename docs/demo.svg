<text id="l5" class="warn" x="20" y="152" style="animation-name:k5">warn   legacy-contract  architecture.md still contains the v1 mandatory-update banner</text>
<text id="l6" class="warn" x="20" y="172" style="animation-name:k6">warn   over-cap         roadmap.md is 38827 chars (cap 20000)</text>
